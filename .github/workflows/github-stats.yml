name: Update GitHub Stats

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Generate DARK GitHub Stats
      # -----------------------------
      - name: Generate Dark Stats
        run: |
          mkdir -p profile

          curl -L \
            "https://github-readme-stats.vercel.app/api?username=pratham1659&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=FFFFFF&text_color=8B949E&icon_color=A78BFA" \
            -o profile/github-stats-dark.svg

      # -----------------------------
      # Generate LIGHT GitHub Stats
      # -----------------------------
      - name: Generate Light Stats
        run: |
          mkdir -p profile

          curl -L \
            "https://github-readme-stats.vercel.app/api?username=pratham1659&show_icons=true&theme=default&hide_border=true&bg_color=FFFFFF&title_color=24292F&text_color=57606A&icon_color=6A11CB" \
            -o profile/github-stats-light.svg

      # -----------------------------
      # Commit generated SVGs
      # -----------------------------
      - name: Commit GitHub Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-stats-dark.svg profile/github-stats-light.svg

          git commit -m "Update GitHub stats" || exit 0

          git push
