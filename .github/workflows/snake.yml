name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Dark Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pratham1659
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161b22%2C%2321292e%2C%2330363d%2C%235b5bd6%2C%238b5cf6

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
